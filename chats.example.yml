# Chats that get every moment (photo + caption + a link to like and comment).
# Email recipients are NOT listed here: they are the people the Immich album is shared with.
# Edits are picked up at the next daily send.

chats:
  # A group: everyone in it shares one link. Visitors are asked for their name once and
  # post through the bot account (BOT_EMAIL) as "[Name] comment".
  - name: Family WhatsApp
    channel: whatsapp
    chat_id: "120363000000000000@g.us"    # find it with: python -m mail_a_patatina whatsapp-groups

  # A one-to-one chat with someone the album is shared with: their link signs in as them.
