{% extends "base.html" %}
{% block title %}{{ _("Unsubscribe") }} · {{ site_title }}{% endblock %}
{% block main %}
<div class="message">
  <h1>{{ _("Stop the emails?") }}</h1>
  <p>{{ _("{email} won't get any more emails with moments, from this or any other family feed. The links keep working.", email=email) }}</p>
  <form method="post" action="{{ base }}/unsubscribe?t={{ token | urlencode }}"><button>{{ _("Unsubscribe") }}</button></form>
</div>
{% endblock %}
