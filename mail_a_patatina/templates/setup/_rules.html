<div class="row">
  <label>Send at<input name="send_time" type="time" value="{{ raw.send_time if raw else '07:00' }}" required></label>
  <label>Timezone<input name="timezone" list="timezones" value="{{ raw.timezone if raw else 'Europe/Berlin' }}" required></label>
</div>
<datalist id="timezones">{% for tz in timezones %}<option value="{{ tz }}">{% endfor %}</datalist>
<fieldset><legend>What to send</legend>
  <label class="choice"><input type="radio" name="send_mode" value="digest" {% if not raw or raw.send_mode != 'drip' %}checked{% endif %}><span><b>Daily digest</b>: everything new since the day before</span></label>
  <label class="choice"><input type="radio" name="send_mode" value="drip" {% if raw and raw.send_mode == 'drip' %}checked{% endif %}><span><b>One a day</b>: a queue, so a big batch spreads over the following days</span></label>
</fieldset>
<label class="choice"><input type="checkbox" name="require_caption" value="1" {% if not raw or raw.require_caption is not false %}checked{% endif %}><span>Only send photos that have a description in Immich (it becomes the caption)</span></label>
<label class="choice"><input type="checkbox" name="keep_photos_on_server" value="1" {% if (raw.keep_photos_on_server if raw and raw.keep_photos_on_server is defined and raw.keep_photos_on_server is not none else s.keep_photos_default) %}checked{% endif %}><span><b>Keep photos on this server</b>: nothing is attached to emails or chat messages. Emails load the photos from here, for {{ s.photo_link_days }} days and only while the photo and the relative are still in the album; chats get the caption and a link.</span></label>
<label class="choice"><input type="checkbox" name="notify_me" value="1" {% if raw and raw.admin_emails %}checked{% endif %}><span>Email me about comments and likes (comments right away, likes once a day)</span></label>
